services:
  model:
    # Compila i test del modello, li esegue e genera la documentazione
    # (vedi model/Dockerfile). model/ è montato in /app così build e docs
    # vengono scritti sul host.
    build:
      context: ./model
    image: pao-model:latest
    volumes:
      - ./model:/app
    # Esegue come l'utente host per non creare file di root su build/ e docs/
    user: "${UID:-1000}:${GID:-1000}"
