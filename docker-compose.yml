services:
  model:
    # Compila i test del modello, li esegue e genera la documentazione
    # (vedi model/Dockerfile). model/ è montato in /app così build e docs
    # vengono scritti sul host.
    build:
      context: ./model
    image: pao-model:latest
    volumes:
      - ./model:/app
    # Esegue come l'utente host per non creare file di root su build/ e docs/
    user: "${UID:-1000}:${GID:-1000}"

  db:
    # PostgreSQL del progetto. Lo schema viene applicato all'avvio
    # da db/schema.sql. La porta 5432 NON è esposta all'host.
    image: postgres:15-alpine
    container_name: pao-db
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    # API server REST: cpp-httplib + nlohmann/json + jwt-cpp + db_repository.
    # Il contesto di build è la radice del repo (servono model/ e db/).
    build:
      context: .
      dockerfile: server/Dockerfile
    image: pao-api:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://events:events@db:5432/events
      JWT_SECRET: dev-secret
      PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    name: pao-backend
